name: Build and deploy to HostGator

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"   # every hour, picks up Google Sheet changes
  workflow_dispatch:        # "Run workflow" button in the Actions tab
    inputs:
      task:
        description: What to run
        type: choice
        default: deploy
        options: [deploy, find-websites, scan-happy-hours]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_dispatch' || inputs.task == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build site from the Google Sheet
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
        run: node build.js

      - name: Upload to HostGator over FTP
        if: hashFiles('dist/index.html') != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ./

  find-websites:
    # One-off: look up websites, phones and socials for tools/bars-input.csv from Overture Maps
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'find-websites'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install overturemaps pandas pyarrow
      - name: Download every place in Philadelphia from Overture Maps
        run: overturemaps download --bbox=-75.2803,39.8670,-74.9558,40.1379 -f geoparquet --type=place -o places.parquet
      - name: Match against the bar list
        run: python tools/find_websites.py places.parquet tools/bars-input.csv websites-found.csv
      - name: Print results
        run: echo "=====BEGIN CSV=====" && cat websites-found.csv && echo "=====END CSV====="
      - uses: actions/upload-artifact@v4
        with:
          name: websites-found
          path: websites-found.csv

  scan-happy-hours:
    # One-off: read each confirmed bar website for happy hour mentions
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'scan-happy-hours'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Scan bar websites
        run: python tools/scan_happy_hours.py tools/confirmed-websites.csv happy-hour-scan.jsonl
      - name: Print results
        run: echo "=====BEGIN JSONL=====" && cat happy-hour-scan.jsonl && echo "=====END JSONL====="
