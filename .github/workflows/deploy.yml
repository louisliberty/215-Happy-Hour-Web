name: Build and deploy to HostGator

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"   # every hour: rebuild the site from Supabase
    - cron: "41 8 * * *"   # nightly (3:41 am Philly time): encrypted database backup and size check
  workflow_dispatch:        # "Run workflow" button in the Actions tab
    inputs:
      task:
        description: What to run
        type: choice
        default: deploy
        options: [deploy, read-db, scan-happy-hours, print-pages, geocode, db-backup, read-sheet, find-websites, db-setup]
      list:
        description: Website list for scan-happy-hours, or URLs (space-separated) for print-pages
        type: string
        default: tools/all-websites.csv

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: (github.event_name != 'workflow_dispatch' && github.event.schedule != '41 8 * * *') || inputs.task == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Send repo changes to Supabase (table changes, website happy hours, coordinates, descriptions)
        if: github.event_name == 'push'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          [ -n "$SUPABASE_DB_URL" ] || { echo "No SUPABASE_DB_URL secret: skipping"; exit 0; }
          changed=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)
          if echo "$changed" | grep -q '^supabase/migrations/'; then
            bash tools/db_migrate.sh
          fi
          if echo "$changed" | grep -qE '^data/(website-happy-hours|coords|bar-notes)\.csv$'; then
            python3 tools/db_import.py --website-only import.sql && psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -f import.sql
          else
            echo "No happy hour data changes in this push"
          fi
          if echo "$changed" | grep -q '^data/review-decisions\.csv$'; then
            python3 tools/db_apply_decisions.py data/review-decisions.csv decisions.sql && psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -At -f decisions.sql
          fi

      - name: Export live happy hours from Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          [ -n "$SUPABASE_DB_URL" ] || { echo "No SUPABASE_DB_URL secret: building from the Google Sheet"; exit 0; }
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At -f tools/site_export.sql
          echo "DB_CSV=db.csv" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build site from the Google Sheet
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
        run: node build.js

      - name: Upload to HostGator over FTP
        if: hashFiles('dist/index.html') != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ./

  find-websites:
    # One-off: look up websites, phones and socials for tools/bars-input.csv from Overture Maps
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'find-websites'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install overturemaps pandas pyarrow
      - name: Download every place in Philadelphia from Overture Maps
        run: overturemaps download --bbox=-75.2803,39.8670,-74.9558,40.1379 -f geoparquet --type=place -o places.parquet
      - name: Match against the bar list
        run: python tools/find_websites.py places.parquet tools/bars-input.csv websites-found.csv
      - name: Print results
        run: echo "=====BEGIN CSV=====" && cat websites-found.csv && echo "=====END CSV====="
      - uses: actions/upload-artifact@v4
        with:
          name: websites-found
          path: websites-found.csv

  scan-happy-hours:
    # One-off: read each confirmed bar website for happy hour mentions
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'scan-happy-hours'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 pypdf playwright pytesseract pillow && python -m playwright install --with-deps chromium
      - run: sudo apt-get install -y -q tesseract-ocr >/dev/null
      - name: Scan bar websites
        run: python tools/scan_happy_hours.py "${{ inputs.list || 'tools/all-websites.csv' }}" happy-hour-scan.jsonl 10
      - name: Print results
        run: echo "=====BEGIN JSONL=====" && cat happy-hour-scan.jsonl && echo "=====END JSONL====="

  read-sheet:
    # Prints the published Google Sheet tab to the log so Claude can read it
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'read-sheet'
    runs-on: ubuntu-latest
    steps:
      - name: Print the sheet
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
        run: |
          curl -sSL "$SHEET_CSV_URL" -o sheet.csv
          echo "=====BEGIN CSV=====" && cat sheet.csv && echo && echo "=====END CSV====="

  print-pages:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'print-pages'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Print pages
        env:
          URLS: ${{ inputs.list }}
        run: python tools/print_pages.py $URLS

  geocode:
    # Map coordinates for every listed bar, for "nearby happy hours" on bar pages
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'geocode'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: List the bars the site publishes
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          LIST_VENUES: venues.csv
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At -f tools/site_export.sql && DB_CSV=db.csv node build.js
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tools/geocode.py venues.csv data/coords.csv
      - name: Print results
        run: echo "=====BEGIN CSV=====" && cat data/coords.csv && echo "=====END CSV====="
      - uses: actions/upload-artifact@v4
        with:
          name: coords
          path: data/coords.csv

  db-setup:
    # Create or update the Supabase tables, then load the sheet and the verified happy hours into them
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'db-setup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the Google Sheet
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
        run: curl -sSfL "$SHEET_CSV_URL" -o sheet.csv && wc -l sheet.csv
      - name: Create or update tables
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash tools/db_migrate.sh
      - name: Load establishments and happy hours
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python3 tools/db_import.py sheet.csv import.sql && psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -f import.sql

  db-backup:
    # Nightly: every table, encrypted (the repo is public), kept 30 days as a job file. Fails, and GitHub emails
    # you, if the database nears the free plan's 500 MB limit.
    if: github.event.schedule == '41 8 * * *' || (github.event_name == 'workflow_dispatch' && inputs.task == 'db-backup')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export every table
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir backup
          for t in establishments happy_hours calls website_checks; do
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -c "\copy $t to 'backup/$t.csv' with (format csv, header)"
          done
          cp supabase/migrations/*.sql backup/
          tar czf backup.tgz backup
      - name: Encrypt
        env:
          BACKUP_KEY: ${{ secrets.BACKUP_KEY || secrets.SUPABASE_DB_URL }}
        run: |
          echo "BACKUP_FILE=supabase-backup-$(date -u +%F).tgz.gpg" >> "$GITHUB_ENV"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_KEY" --symmetric --cipher-algo AES256 \
            -o "supabase-backup-$(date -u +%F).tgz.gpg" backup.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30
      - name: Size check
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mb=$(psql "$SUPABASE_DB_URL" -At -c "select pg_database_size(current_database()) / 1048576")
          rows=$(psql "$SUPABASE_DB_URL" -At -F ', ' -c "select (select count(*) from establishments) || ' establishments', (select count(*) from happy_hours) || ' happy hours', (select count(*) from calls) || ' calls', (select count(*) from website_checks) || ' website checks'")
          echo "Database size: ${mb} MB of the free plan's 500 MB. ${rows}." | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$mb" -ge 400 ]; then
            echo "::error::The Supabase database is ${mb} MB, close to the free plan's 500 MB limit. Time to upgrade to Pro."
            exit 1
          fi

  read-db:
    # For the weekly check: every establishment (old sheet columns), the review queue and what the site publishes
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'read-db'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export from Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At -f tools/db_read.sql
      - name: Print the files
        run: |
          echo "=====BEGIN CSV=====" && cat sheet.csv && echo "=====END CSV====="
          echo "=====BEGIN REVIEW CSV=====" && cat review.csv && echo "=====END REVIEW CSV====="
          echo "=====BEGIN DB CSV=====" && cat db.csv && echo "=====END DB CSV====="
