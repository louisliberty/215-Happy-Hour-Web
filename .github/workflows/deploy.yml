name: Build and deploy to HostGator

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"   # every hour, picks up Google Sheet changes
  workflow_dispatch:        # "Run workflow" button in the Actions tab
    inputs:
      task:
        description: What to run
        type: choice
        default: deploy
        options: [deploy, find-websites, scan-happy-hours, read-sheet, print-pages, geocode, db-setup]
      list:
        description: Website list for scan-happy-hours, or URLs (space-separated) for print-pages
        type: string
        default: tools/all-websites.csv

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_dispatch' || inputs.task == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build site from the Google Sheet
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
        run: node build.js

      - name: Upload to HostGator over FTP
        if: hashFiles('dist/index.html') != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ./

  find-websites:
    # One-off: look up websites, phones and socials for tools/bars-input.csv from Overture Maps
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'find-websites'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install overturemaps pandas pyarrow
      - name: Download every place in Philadelphia from Overture Maps
        run: overturemaps download --bbox=-75.2803,39.8670,-74.9558,40.1379 -f geoparquet --type=place -o places.parquet
      - name: Match against the bar list
        run: python tools/find_websites.py places.parquet tools/bars-input.csv websites-found.csv
      - name: Print results
        run: echo "=====BEGIN CSV=====" && cat websites-found.csv && echo "=====END CSV====="
      - uses: actions/upload-artifact@v4
        with:
          name: websites-found
          path: websites-found.csv

  scan-happy-hours:
    # One-off: read each confirmed bar website for happy hour mentions
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'scan-happy-hours'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 pypdf playwright && python -m playwright install --with-deps chromium
      - name: Scan bar websites
        run: python tools/scan_happy_hours.py "${{ inputs.list || 'tools/all-websites.csv' }}" happy-hour-scan.jsonl 10
      - name: Print results
        run: echo "=====BEGIN JSONL=====" && cat happy-hour-scan.jsonl && echo "=====END JSONL====="

  read-sheet:
    # Prints the published Google Sheet tab to the log so Claude can read it
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'read-sheet'
    runs-on: ubuntu-latest
    steps:
      - name: Print the sheet
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
        run: |
          curl -sSL "$SHEET_CSV_URL" -o sheet.csv
          echo "=====BEGIN CSV=====" && cat sheet.csv && echo && echo "=====END CSV====="

  print-pages:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'print-pages'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Print pages
        env:
          URLS: ${{ inputs.list }}
        run: python tools/print_pages.py $URLS

  geocode:
    # Map coordinates for every listed bar, for "nearby happy hours" on bar pages
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'geocode'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: List the bars the site publishes
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
          LIST_VENUES: venues.csv
        run: node build.js
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tools/geocode.py venues.csv data/coords.csv
      - name: Print results
        run: echo "=====BEGIN CSV=====" && cat data/coords.csv && echo "=====END CSV====="
      - uses: actions/upload-artifact@v4
        with:
          name: coords
          path: data/coords.csv

  db-setup:
    # Create or update the Supabase tables, then load the sheet and the verified happy hours into them
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'db-setup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the Google Sheet
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
        run: curl -sSfL "$SHEET_CSV_URL" -o sheet.csv && wc -l sheet.csv
      - name: Create or update tables
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: for f in supabase/migrations/*.sql; do psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -f "$f"; done
      - name: Load establishments and happy hours
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python3 tools/db_import.py sheet.csv import.sql && psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -f import.sql
